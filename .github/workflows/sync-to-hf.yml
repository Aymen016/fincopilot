name: Sync backend to HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - "fincopilot-backend/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          git clone https://Aymen1617:$HF_TOKEN@huggingface.co/spaces/Aymen1617/fincopilot-api hf_space

          rsync -av --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='fincopilot.db' \
            fincopilot-backend/ hf_space/

          cd hf_space
          git add -A
          git diff --staged --quiet || git commit -m "sync: ${{ github.sha }}"
          git push
