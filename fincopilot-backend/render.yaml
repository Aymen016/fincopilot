services:
  - type: web
    name: fincopilot-api
    runtime: python
    rootDir: fincopilot-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false       # set manually in Render dashboard
      - key: SECRET_KEY
        sync: false       # set manually in Render dashboard
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: ALLOWED_ORIGINS
        sync: false       # set to your Vercel URL, e.g. https://fincopilot-blue.vercel.app
