version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fincopilot
      POSTGRES_PASSWORD: fincopilot_secret
      POSTGRES_DB: fincopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./fincopilot-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fincopilot:fincopilot_secret@db:5432/fincopilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-fincopilot-uploads}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fincopilot-backend:/app
      - model_artifacts:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./fincopilot-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fincopilot:fincopilot_secret@db:5432/fincopilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fincopilot-backend:/app
      - model_artifacts:/app/models
    command: celery -A app.tasks.celery_app worker --loglevel=info

  beat:
    build: ./fincopilot-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fincopilot:fincopilot_secret@db:5432/fincopilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./fincopilot-backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build: ./fincopilot-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api
    volumes:
      - ./fincopilot-frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  model_artifacts:
